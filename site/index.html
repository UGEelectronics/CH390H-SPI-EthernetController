<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CH390H SPI Ethernet Controller</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1419;
      --card: #1a222c;
      --text: #e8eef4;
      --muted: #9aa8b6;
      --accent: #3d9cf0;
      --border: #2a3644;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }
    h1 { font-size: 1.75rem; margin: 0 0 0.5rem; }
    p { color: var(--muted); }
    .hero {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin: 1.5rem 0;
      text-align: center;
    }
    .hero img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1.25rem;
    }
    a.button {
      display: inline-block;
      background: var(--accent);
      color: #061018;
      font-weight: 600;
      text-decoration: none;
      padding: 0.7rem 1.1rem;
      border-radius: 8px;
    }
    a.secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    footer { margin-top: 2rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>CH390H SPI to Ethernet Controller</h1>
    <p>10/100 Mbps Ethernet expansion for microcontrollers over SPI. Open the interactive BOM in your browser — no download required.</p>
    <div class="hero">
      <img src="pcb.jpg" alt="CH390H SPI Ethernet module PCB">
      <div class="actions">
        <a class="button" href="bom.html">Open interactive BOM</a>
        <a class="button secondary" href="https://github.com/UGEelectronics/CH390H-SPI-EthernetController">GitHub repository</a>
      </div>
    </div>
    <footer>
      UG Electronics · 3.3 V module · schematic and firmware are in the repository.
    </footer>
  </main>
</body>
</html>
